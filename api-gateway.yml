logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

          routes:

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1

            - id: claim-service
              uri: lb://CLAIM-SERVICE
              predicates:
                - Path=/claims/**
              filters:
                - StripPrefix=1

            - id: policy-service
              uri: lb://POLICY-SERVICE
              predicates:
                - Path=/policies/**
              filters:
                - StripPrefix=1

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**
              filters:
                - StripPrefix=1

  lifecycle:
    timeout-per-shutdown-phase: 15s

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    urls:
      - name: Customer Service
        url: /customer/v3/api-docs

      - name: Claim Service
        url: /claims/v3/api-docs

      - name: Policy Service
        url: /policies/v3/api-docs

      - name: Notification Service
        url: /notifications/v3/api-docs

app:
  security:
    public-routes:
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /customer/v3/api-docs/**
      - /claims/v3/api-docs/**
      - /policies/v3/api-docs/**
      - /notifications/v3/api-docs/**
      - /customer/auth/signup
      - /customer/auth/login
      - /customer/webhooks/**

jwt:
  secret-key: ${JWT_SECRET:local-dev-only-secret-key-change-me-1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
